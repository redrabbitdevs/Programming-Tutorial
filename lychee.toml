# lychee link-check config — used by the CI `links` job against built HTML in dist/.
# Keys must match the pinned lychee version's schema (v0.24.x, deny_unknown_fields).

# Per-request timeout in seconds (connect through response finished)
timeout = 15
# Retries per failed request
max_retries = 2
# Concurrent network requests (default 128 is far above what a small static site needs)
max_concurrency = 16

# Internal links are checked as local files under dist/, so no loopback or
# private-IP exclusions are needed (and would only mask real failures).
exclude = [
  # TODO(T-009/T-011): remove once every /languages/<slug>/ route resolves.
  # T-010 shipped the routes: only the `python` demo slug on /docs/design-system/
  # resolves; c/java/fortran/cobol/rust/scratch/abap still 404 until their
  # records + pages land. Matches post-remap file URIs (base prefix already
  # stripped by --remap).
  ".*/languages(/.*)?$",
]
